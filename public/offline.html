<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Logbook Onko-Gin</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f6f8fb;
        color: #0f172a;
        text-align: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 22rem;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0.75rem 0 0.25rem;
      }
      p {
        color: #64748b;
        font-size: 0.9rem;
        margin: 0 0 1.25rem;
      }
      button {
        border: 0;
        border-radius: 0.6rem;
        padding: 0.6rem 1.1rem;
        font-size: 0.9rem;
        color: #fff;
        background: linear-gradient(90deg, #0d9488, #10b981);
        cursor: pointer;
      }
      .dot {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        margin: 0 auto;
        background: linear-gradient(135deg, #14b8a6, #10b981);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot"></div>
      <h1>Anda sedang offline</h1>
      <p>
        Sambungan internet terputus. Periksa koneksi lalu coba muat ulang
        halaman.
      </p>
      <button onclick="location.reload()">Coba lagi</button>
    </div>
  </body>
</html>
